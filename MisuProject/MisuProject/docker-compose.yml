##docker run -d -p 5189:8000 --name misu_backend_container misu_backend_image
version: "3.8"
services:
  backend:
    build:
      context: ./
    ports:
     - "5189:5189"
    container_name: webApi
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5189
    depends_on:
     - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_container
    environment:
     SA_PASSWORD: "Password123@"
     ACCEPT_EULA: "Y"
    ports:
        - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql
volumes:
  sql_data:
      
     