<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoftQA</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="./css/allmin.css" />
     <script src="js/Home.js"></script>
    <script src="js/chat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css" />

</head>
<body>
    <div class="contanier">
        <!-- Navbar -->
        <div class="navdiv">
            <div class="chatbutton">
                <button class="hvr-underline-from-center"><i class="fa-regular fa-message"></i></button>
            </div>
            <a href="#" id="logouts"><i class="fa-solid fa-right-from-bracket"></i></a>
            <div class="navlists">
                <nav>
                    <li><a href="#" class="a1 hvr-underline-from-center"><div class="tag"><p>{...}</p></div>Home</a></li>
                    <li><a href="#" class="a2 hvr-underline-from-center">About</a></li>
                    <li><a href="#" class="a3 hvr-underline-from-center">Contact</a></li>
                </nav>
            </div>
        </div>

        <!-- Dynamic Cards Section -->
        <div class="main" id="userCardsContainer"></div>

        <!-- Message Box -->
        <div id="msg">
            <div class="msgcontan">
                <button type="button" id="close-msg"><i class="fa-solid fa-xmark"></i></button>
                <p>You are following "name"</p>
                <i class="fa-solid fa-check"></i>
            </div>
        </div>
         
        <div class="chat">
            <div id="chatMessages"></div>
            <div id="chatMessages2"></div>
            <input type="text" id="chatInput" placeholder="Type a message and press Enter...">
            
        </div>
    </div>
   
  
   
</body>
</html>
